name: Prepare public project media
on:
  push:
    branches: [revision/minimal-media]
    paths: [.github/workflows/media-review.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the author's already-public posts
        run: |
          mkdir -p media-review assets/media
          python - <<'PY'
          import json, urllib.request, pathlib
          root=pathlib.Path('media-review')
          for ident in ['2099037040000278990','2099376636974240137','2098413419204669909']:
              for host in ['api.fxtwitter.com','api.vxtwitter.com']:
                  url=f'https://{host}/yakshawan/status/{ident}'
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      data=json.load(urllib.request.urlopen(req,timeout=35))
                      (root/f'{ident}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
                      print(ident,host,json.dumps(data,ensure_ascii=False)[:22000])
                      break
                  except Exception as exc:
                      print(ident,host,type(exc).__name__,str(exc)[:200])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-media-metadata
          path: media-review
          retention-days: 3
      - name: Keep public metadata on the revision branch for asset selection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media-review
          if ! git diff --cached --quiet; then
            git commit -m 'Record public source media for the website revision'
            git push origin HEAD:revision/minimal-media
          fi
