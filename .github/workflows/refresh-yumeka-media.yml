name: Refresh FFREP Yumeka media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-yumeka-media.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch latest public YUMEKA clip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade yt-dlp

          URL='https://x.com/yakshawan/status/2100860400514576785'
          if ! python -m yt_dlp --no-playlist -f 'bestvideo[ext=mp4]/best[ext=mp4]/best' -o '/tmp/yumeka-new.%(ext)s' "$URL"; then
            echo 'yt-dlp failed; trying FxTwitter public metadata.'
            curl -fsSL 'https://api.fxtwitter.com/status/2100860400514576785' -o /tmp/fxtwitter.json
            VIDEO_URL=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/fxtwitter.json',encoding='utf-8'))
          videos=data.get('tweet',{}).get('media',{}).get('videos',[])
          if not videos:
              raise SystemExit('No video URL in FxTwitter response')
          videos=sorted(videos,key=lambda v:(v.get('width',0)*v.get('height',0),v.get('bitrate',0)),reverse=True)
          print(videos[0]['url'])
          PY
            )
            curl -fL "$VIDEO_URL" -o /tmp/yumeka-new.mp4
          fi
          NEW=$(find /tmp -maxdepth 1 -type f -name 'yumeka-new.*' | head -n1)
          test -n "$NEW"

          # Keep the previous Sep 15 clip as an archived FAQ asset before replacing the hero.
          cp assets/media/yumeka-training.mp4 assets/media/yumeka-training-2026-09-15.mp4
          cp assets/media/yumeka-training.webp assets/media/yumeka-training-2026-09-15.webp

          # Preserve the X encode when possible; remux only, strip audio, and make streaming start fast.
          ffmpeg -y -i "$NEW" -map 0:v:0 -an -c:v copy -movflags +faststart assets/media/yumeka-training.mp4
          # Poster from a frame where the elbow/foreleg-like pose is clearly visible.
          ffmpeg -y -ss 14.6 -i assets/media/yumeka-training.mp4 -frames:v 1 -vf 'scale=1280:-2:flags=lanczos' -c:v libwebp -quality 84 assets/media/yumeka-training.webp

          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration,size -of json assets/media/yumeka-training.mp4

      - name: Update site copy and media mapping
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root=Path('.')

          ko_path=root/'content/ko.json'
          en_path=root/'content/en.json'
          ko=json.loads(ko_path.read_text('utf-8'))
          en=json.loads(en_path.read_text('utf-8'))

          ko['meta']['updated']='2026-09-18'
          en['meta']['updated']='2026-09-18'

          ko['ui']['pastCaption']='YUMEKA · 탐색 ON 훈련 장면 · 2026.09.15'
          ko['ui']['pastDescription']=ko['ui']['mainDescription']
          en['ui']['pastCaption']='YUMEKA · Training with exploration ON · Sep 15, 2026'
          en['ui']['pastDescription']=en['ui']['mainDescription']

          ko['ui']['mainCaption']='YUMEKA · 팔꿈치 제어가 나타난 훈련 장면 · 2026.09.18'
          ko['ui']['mainDescription']='팔꿈치를 굽힐 수 있게 된 뒤, 팔을 초파리의 앞다리와 비슷한 방식으로 사용하는 듯한 움직임이 나타난 최근 훈련 장면입니다. 왼쪽에는 신경 활동, 오른쪽에는 위에서 본 이동 장면이 함께 표시됩니다.'
          en['ui']['mainCaption']='YUMEKA · Training after emerging elbow control · Sep 18, 2026'
          en['ui']['mainDescription']="A recent YUMEKA training clip after elbow flexion became available, showing arm movements that resemble the use of a fruit fly's forelegs. Neural activity appears on the left, with an overhead view on the right."

          for data in (ko,en):
              goal=next(q for q in data['faq'] if q['id']=='goal')
              goal['media']='yumeka-training-archive'

          ko_path.write_text(json.dumps(ko,ensure_ascii=False,indent=2)+'\n','utf-8')
          en_path.write_text(json.dumps(en,ensure_ascii=False,indent=2)+'\n','utf-8')

          build=root/'scripts/build.py'
          s=build.read_text('utf-8')
          old="""MEDIA = ('yumeka-training.mp4', 'yumeka-training.webp', 'shoki-training.mp4',
                   'shoki-training.webp', 'yumeka-model.webp', 'malecns-poster.webp')
          """
          new="""MEDIA = ('yumeka-training.mp4', 'yumeka-training.webp',
                   'yumeka-training-2026-09-15.mp4', 'yumeka-training-2026-09-15.webp',
                   'shoki-training.mp4', 'shoki-training.webp', 'yumeka-model.webp', 'malecns-poster.webp')
          """
          assert old in s
          s=s.replace(old,new)

          old="""POSTS = {'main': 'https://x.com/yakshawan/status/2099806286468849665',
                   'shoki': 'https://x.com/yakshawan/status/2099813850426245440'}
          """
          new="""POSTS = {'main': 'https://x.com/yakshawan/status/2100860400514576785',
                   'past': 'https://x.com/yakshawan/status/2099806286468849665',
                   'shoki': 'https://x.com/yakshawan/status/2099813850426245440'}
          """
          assert old in s
          s=s.replace(old,new)

          old="""def video(which, main=False):
              basename = 'yumeka-training' if main else 'shoki-training'
              prefix = 'main' if main else 'shoki'
              cls = 'main-film' if main else 'training-film'
              return (f'<figure class="{cls}"><video controls playsinline preload="none" width="1280" height="670" '
          """
          new="""def video(which, main=False):
              if main:
                  basename, prefix, cls, height = 'yumeka-training', 'main', 'main-film', 720
              elif which == 'past':
                  basename, prefix, cls, height = 'yumeka-training-2026-09-15', 'past', 'training-film', 670
              else:
                  basename, prefix, cls, height = 'shoki-training', 'shoki', 'training-film', 670
              return (f'<figure class="{cls}"><video controls playsinline preload="none" width="1280" height="{height}" '
          """
          assert old in s
          s=s.replace(old,new)

          old="""def media(name):
              if name == 'shoki-training':
                  return video('shoki')
          """
          new="""def media(name):
              if name == 'shoki-training':
                  return video('shoki')
              if name == 'yumeka-training-archive':
                  return video('past')
          """
          assert old in s
          s=s.replace(old,new)
          build.write_text(s,'utf-8')

          css=root/'assets/site.css'
          s=css.read_text('utf-8')
          assert '.main-film video{display:block;width:100%;height:auto;aspect-ratio:1720/900;' in s
          s=s.replace('.main-film video{display:block;width:100%;height:auto;aspect-ratio:1720/900;',
                      '.main-film video{display:block;width:100%;height:auto;aspect-ratio:16/9;')
          assert '.main-film video{aspect-ratio:1720/900}' in s
          s=s.replace('.main-film video{aspect-ratio:1720/900}', '.main-film video{aspect-ratio:16/9}')
          css.write_text(s,'utf-8')

          sources_path=root/'assets/media/sources.json'
          sources=json.loads(sources_path.read_text('utf-8'))
          old_entry=sources[0]
          old_entry['name']='yumeka-training-2026-09-15'
          old_entry['file']='yumeka-training-2026-09-15.mp4'
          old_entry['poster']='yumeka-training-2026-09-15.webp'

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          old_media=root/'assets/media/yumeka-training-2026-09-15.mp4'
          old_entry['sha256']=sha(old_media)
          old_entry['bytes']=old_media.stat().st_size

          new_media=root/'assets/media/yumeka-training.mp4'
          new_entry={
              'name':'yumeka-training',
              'source':'https://x.com/yakshawan/status/2100860400514576785',
              'published':'2026-09-18',
              'description':'팔꿈치를 굽힐 수 있게 된 뒤, 팔을 앞다리처럼 사용하는 듯한 움직임이 나타난 최근 YUMEKA 훈련 영상.',
              'kind':'video',
              'file':'yumeka-training.mp4',
              'poster':'yumeka-training.webp',
              'duration':21.6,
              'edit':'X public video encode; audio removed; video stream remuxed without re-encoding.',
              'sha256':sha(new_media),
              'bytes':new_media.stat().st_size,
          }
          sources_path.write_text(json.dumps([new_entry,old_entry,*sources[1:]],ensure_ascii=False,indent=2)+'\n','utf-8')
          PY

      - name: Build and test
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -v

      - name: Commit refreshed media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media content scripts/build.py assets/site.css
          git commit -m 'Feature Sep 18 YUMEKA elbow-control clip'
          git push
