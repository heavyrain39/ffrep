<!doctype html>
<html lang="{{meta.lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{meta.description}}">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{meta.title}}">
  <meta property="og:description" content="{{meta.description}}">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:image" content="https://heavyrain39.github.io/ffrep/assets/media/yumeka-training.webp">
  <title>{{meta.title}}</title>
  <link rel="icon" href="./assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/MuseoModerno-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./assets/site.css">
  <link rel="stylesheet" href="./assets/typography.css">
  <script src="./assets/site.js" defer></script>
</head>
<body id="top">
  <a class="skip" href="#main" data-i18n="ui.skip">{{ui.skip}}</a>
  <div class="page">
    <header class="masthead">
      <h1 data-i18n="intro.title">{{intro.title}}</h1>
      <div class="language" role="group" aria-label="{{ui.language}}" data-i18n-attr="aria-label:ui.language">{{_languages}}</div>
    </header>
    <main id="main">
      <section aria-labelledby="question">
        <div class="intro">
          <h2 id="question" data-i18n="intro.question">{{intro.question}}</h2>
          <p data-i18n="intro.text">{{intro.text}}</p>
        </div>
        {{_main_video}}
      </section>
      <section class="faq" aria-labelledby="faq-title">
        <div class="faq-heading"><h2 id="faq-title" data-i18n="ui.faq">{{ui.faq}}</h2></div>
        <div class="faq-list">{{_faqs}}</div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer-addresses">
        <a href="https://heavyrain39.github.io/portfolio/" data-i18n="ui.portfolio">{{ui.portfolio}}</a>
        <a href="mailto:ggolem@naver.com">ggolem@naver.com</a>
      </div>
    </footer>
  </div>
  <script type="application/json" id="site-config">{{_config}}</script>
</body>
</html>
